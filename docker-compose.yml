
version: '3.8'

services:
  vetsoft:
    image: germansalinas1994/vetsoft-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Mapea el puerto 8000 del contenedor al puerto 8000 de tu host
    volumes:
      - //Users/germansalinas/Proyectos facultad/Proyecto Jenkins/vetsoft/db.sqlite3:/app/db.sqlite3  # Mapea el archivo de la base de datos
    environment:
      - DJANGO_SETTINGS_MODULE=vetsoft.settings
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 vetsoft.wsgi
